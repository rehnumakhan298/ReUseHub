<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - ReUseHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main>

    <section class="section">
      <div class="container-narrow">
        <h1 class="page-title">Log in</h1>
        <p class="page-intro">Student login. Administrators use the <a href="admin-login.html">admin login</a>.</p>
        <div id="auth-message" class="hidden" role="alert"></div>
        <form id="auth-form" class="form-card" data-mode="login" novalidate>
          <div class="form-group"><label for="email">Email address</label><input type="email" id="email" autocomplete="email" required></div>
          <div class="form-group"><label for="password">Password</label>
            <div class="password-wrap"><input type="password" id="password" autocomplete="current-password" required>
            <button type="button" class="btn btn-light btn-small" data-toggle-password="password" aria-pressed="false">Show</button></div></div>
          <button type="submit" class="btn btn-primary">Log in</button>
          <p class="form-footer">New here? <a href="register.html">Create an account</a></p>
        </form>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
