<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ReUseHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main>

    <section class="section">
      <div class="container-narrow">
        <h1 class="page-title">Create your account</h1>
        <p class="page-intro">Registration creates a student account.</p>
        <div id="auth-message" class="hidden" role="alert"></div>
        <form id="auth-form" class="form-card" data-mode="register" novalidate>
          <div class="form-group"><label for="fullName">Full name</label><input type="text" id="fullName" maxlength="100" autocomplete="name" required></div>
          <div class="form-group"><label for="email">Email address</label><input type="email" id="email" maxlength="150" autocomplete="email" required></div>
          <div class="form-group"><label for="department">Department</label><input type="text" id="department" maxlength="100" placeholder="e.g. Computer Science" required></div>
          <div class="form-group"><label for="password">Password</label>
            <div class="password-wrap"><input type="password" id="password" autocomplete="new-password" required>
            <button type="button" class="btn btn-light btn-small" data-toggle-password="password" aria-pressed="false">Show</button></div>
            <div class="hint">At least 8 characters with a letter and a number.</div></div>
          <div class="form-group"><label for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" autocomplete="new-password" required></div>
          <div class="form-group checkbox-row"><input type="checkbox" id="agreeRules" required>
            <label for="agreeRules">I agree to the platform rules: list only items I own, be honest about condition, and no prohibited or unsafe items.</label></div>
          <button type="submit" class="btn btn-primary">Register</button>
          <p class="form-footer">Already registered? <a href="login.html">Log in</a></p>
        </form>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
