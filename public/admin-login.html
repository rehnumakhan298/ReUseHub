<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Log in - ReUseHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main>

    <section class="section">
      <div class="container-narrow">
        <h1 class="page-title">Administrator login</h1>
        <p class="page-intro">For platform administrators only.</p>
        <div id="auth-message" class="hidden" role="alert"></div>
        <form id="auth-form" class="form-card" data-mode="admin" novalidate>
          <div class="form-group"><label for="email">Admin email</label><input type="email" id="email" autocomplete="username" required></div>
          <div class="form-group"><label for="password">Password</label>
            <div class="password-wrap"><input type="password" id="password" autocomplete="current-password" required>
            <button type="button" class="btn btn-light btn-small" data-toggle-password="password" aria-pressed="false">Show</button></div></div>
          <button type="submit" class="btn btn-dark">Log in as admin</button>
        </form>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
